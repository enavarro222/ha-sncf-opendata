[project]
name = "ha-sncf-opendata"
version = "0.1.0"
description = "Home Assistant integration for SNCF trains from the official open data (GTFS and GTFS-RT)"
license = "MIT"
requires-python = ">=3.14"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:google.protobuf.*"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "D", "ASYNC", "PT", "TRY"]
ignore = ["D203", "D213", "PLR0913", "PLR0917", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "TRY003", "TRY004", "TRY400", "RUF012", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "PLR2004", "PLC0415", "ASYNC240"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
plugins = []
packages = ["custom_components.sncf_opendata"]

[[tool.mypy.overrides]]
module = ["google.transit.*", "google.protobuf.*"]
ignore_missing_imports = true
follow_imports = "skip"
